# Storefront pages come from the backend: the built index.html with the page's title,
# meta tags, structured data and content filled in, and a real 404 for unknown URLs
# (backend/app/services/pages.py). Existing files (assets, robots.txt, images) are
# served as is. If the backend can't render, the plain index.html is served instead.

location / {
    try_files $uri @page;
}

# "/" is a directory, so `try_files $uri` above would serve index.html for it directly;
# the first name here never exists, so the home page goes to the backend too.
location = / {
    try_files /__render__ @page;
}

# The template the backend fills in; not a page of its own.
location = /index.html {
    add_header X-Robots-Tag "noindex" always;
}

# Product feed for Google Merchant Center / Meta catalog.
location /feed/ {
    proxy_pass $backend_upstream/api/v1$request_uri;
    proxy_set_header Host $host;
}

location @page {
    proxy_pass $backend_upstream/api/v1/page$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
    proxy_intercept_errors on;
    error_page 500 502 503 504 = @spa;
}

location @spa {
    try_files /index.html =404;
}

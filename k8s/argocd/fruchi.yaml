apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fruchi
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/akryzhanovskiy/fruchi-cicd.git
    targetRevision: main
    path: k8s/base
  destination:
    server: https://kubernetes.default.svc
    namespace: fruchi
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

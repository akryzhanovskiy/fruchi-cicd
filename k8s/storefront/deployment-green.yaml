apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront-green
  namespace: fruchi
  labels:
    app: storefront
    color: green
spec:
  replicas: 2
  selector:
    matchLabels:
      app: storefront
      color: green
  template:
    metadata:
      labels:
        app: storefront
        color: green
    spec:
      containers:
        - name: storefront
          image: ghcr.io/akryzhanovskiy/fruchi-storefront:ca0d0644d554865d795f5ec578ab958caf498183
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef: {name: fruchi-frontend-config}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 15
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 128Mi}

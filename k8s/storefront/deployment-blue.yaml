apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront-blue
  namespace: fruchi
  labels:
    app: storefront
    color: blue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: storefront
      color: blue
  template:
    metadata:
      labels:
        app: storefront
        color: blue
    spec:
      containers:
        - name: storefront
          image: ghcr.io/akryzhanovskiy/fruchi-storefront:41edeaa2d6e71b3f08ce6eb1e1a0610b2436efe3
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef: {name: fruchi-frontend-config}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 15
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 128Mi}

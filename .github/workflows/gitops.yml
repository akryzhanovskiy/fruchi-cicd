name: GitOps CI/CD (ArgoCD)

# CI: unit tests -> build & push images to GHCR.
# CD: bump image tags in k8s/base/kustomization.yaml; ArgoCD syncs the cluster from git.
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/admin/**"
      - "frontend/packages/**"
      - ".github/workflows/gitops.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/admin/**"
      - "frontend/packages/**"
      - ".github/workflows/gitops.yml"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: gitops-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  test-backend:
    name: Unit tests (backend)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fruchi
          POSTGRES_PASSWORD: fruchi
          POSTGRES_DB: fruchi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fruchi" --health-interval 5s
          --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest

  test-admin:
    name: Unit tests (admin)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -w admin

  build:
    name: Build & push ${{ matrix.image }}
    needs: [test-backend, test-admin]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: fruchi-backend
            context: backend
            build-args: ""
          - image: fruchi-admin
            context: frontend
            build-args: APP=admin
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          build-args: ${{ matrix.build-args }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  update-manifests:
    name: Update image tags in git (ArgoCD deploys)
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: "5.4.3"
      - name: Set new image tags
        working-directory: k8s/base
        run: |
          kustomize edit set image \
            fruchi-backend=${IMAGE_PREFIX}/fruchi-backend:${GITHUB_SHA} \
            fruchi-admin=${IMAGE_PREFIX}/fruchi-admin:${GITHUB_SHA}
          git diff
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy(gitops): fruchi-backend, fruchi-admin -> ${GITHUB_SHA::7}"
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
